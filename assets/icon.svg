<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EE" />
      <stop offset="100%" stop-color="#EBE7DE" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A6E" />
      <stop offset="100%" stop-color="#E83E58" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313745" />
      <stop offset="100%" stop-color="#1E232E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />

  <!-- Calendar Dark Plate -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#cardGrad)" />

  <!-- Calendar Header Bar -->
  <path d="M96 160 C96 124.6 124.6 96 160 96 L352 96 C387.4 96 416 124.6 416 160 L416 176 L96 176 Z" fill="url(#coralGrad)" />

  <!-- Rings / Binder Pegs -->
  <rect x="168" y="74" width="24" height="44" rx="12" fill="#FFFFFF" />
  <rect x="320" y="74" width="24" height="44" rx="12" fill="#FFFFFF" />

  <!-- Grid Dots / Days representation -->
  <circle cx="160" cy="230" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="224" cy="230" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="288" cy="230" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="352" cy="230" r="14" fill="#FF5A6E" />

  <circle cx="160" cy="290" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="224" cy="290" r="14" fill="#FF5A6E" />
  <circle cx="288" cy="290" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="352" cy="290" r="14" fill="#FFFFFF" fill-opacity="0.9" />

  <circle cx="160" cy="350" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="224" cy="350" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="288" cy="350" r="14" fill="#FF5A6E" />
  <circle cx="352" cy="350" r="14" fill="#FFFFFF" fill-opacity="0.4" />

  <!-- User / Share Overlay Badge -->
  <circle cx="376" cy="376" r="64" fill="url(#coralGrad)" filter="url(#shadow)" />
  <path d="M376 348 L376 404 M348 376 L404 376" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
</svg>
